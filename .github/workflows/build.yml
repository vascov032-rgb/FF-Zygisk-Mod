name: Build Zygisk Mod Menu
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Baixar ImGui
      run: git clone https://github.com/ocornut/imgui.git -b docking imgui
        
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        
    - name: Build Module
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)
        
    - name: Empacotar ZIP
      run: |
        mkdir -p zip_out/zygisk
        cp module.prop zip_out/
        cp build/libarm64-v8a.so zip_out/zygisk/arm64-v8a.so
        # A MÁGICA ESTÁ AQUI: Copiando a biblioteca C++ do NDK para o zip
        cp $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so zip_out/zygisk/ || true
        cd zip_out && zip -r ../ff_mod_menu.zip *
        
    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:
        name: FF-Mod-Menu-ZIP
        path: ff_mod_menu.zip
