name: Build Zygisk Mod Menu
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Baixar ImGui
      run: git clone https://github.com/ocornut/imgui.git -b docking imgui
        
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        
    - name: Build Module
      run: |
        rm -rf build
        mkdir -p build
        cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)
        
    - name: Empacotar ZIP
      run: |
        mkdir -p zip_out/zygisk
        cp module.prop zip_out/
        cp build/libarm64-v8a.so zip_out/zygisk/
        cd zip_out && zip -r ../ff_mod_menu.zip *
        
    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:
        name: FF-Mod-Menu-ZIP
        path: ff_mod_menu.zip
